  <text x="90" y="576" fill="#ffffff" font-family="system-ui,sans-serif" font-size="34" font-weight="900">USD 1,585.12 remaining</text>
  <text x="1110" y="600" text-anchor="end" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="17">coolak.github.io/anthropic-claude-billing-incident</text>
