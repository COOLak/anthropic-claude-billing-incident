  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#16304f"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="54" y="48" width="1092" height="579" rx="30" fill="#0f1d30" stroke="#315073" stroke-width="2"/>
  <text x="90" y="112" fill="#86efac" font-family="system-ui,sans-serif" font-size="25" font-weight="800" letter-spacing="3">CORRECTION • SEPTEMBER 3, 2026</text>
  <text x="90" y="190" fill="#ffffff" font-family="system-ui,sans-serif" font-size="52" font-weight="900">USD 49.88 + USD 49.20</text>
  <text x="90" y="250" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="40" font-weight="850">genuine Platform/API credit grants</text>
  <text x="90" y="306" fill="#dceafe" font-family="system-ui,sans-serif" font-size="30" font-weight="700">Withdrawn from the consumer refund dispute</text>
  <line x1="90" x2="1110" y1="354" y2="354" stroke="#315073" stroke-width="2"/>
  <text x="90" y="416" fill="#b8c6da" font-family="system-ui,sans-serif" font-size="24">Corrected active Individual extra-usage dispute</text>
