  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="54" y="48" width="1092" height="579" rx="30" fill="#0f1d30" stroke="#315073" stroke-width="2"/>
  <text x="90" y="112" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="25" font-weight="800" letter-spacing="3">CORRECTED CONSUMER DISPUTE</text>
