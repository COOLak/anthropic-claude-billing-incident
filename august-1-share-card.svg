<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">August 1 Claude post-reset billing incident — 995 dollars and 67 cents in automatic recharges disputed</title>
  <desc id="desc">Privacy-safe evidence graphic for two automatic Claude Individual-plan extra-usage recharges after the customer observed included limits had reset. Payment records prove the transactions; Anthropic holds the missing entitlement-to-debit ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#200b10"/>
    </linearGradient>
    <linearGradient id="money" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="255" fill="#be123c" opacity=".10"/>
  <circle cx="40" cy="650" r="250" fill="#2563eb" opacity=".12"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(64 48)">
      <rect width="330" height="36" rx="18" fill="#1f2937" stroke="#475569"/>
      <circle cx="22" cy="18" r="6" fill="#f59e0b"/>
      <text x="40" y="24" fill="#e5e7eb" font-size="16" font-weight="700">CUSTOMER EVIDENCE • UNRESOLVED</text>
    </g>

    <text x="64" y="139" fill="#ffffff" font-size="43" font-weight="700">CUSTOMER-OBSERVED:</text>
    <text x="64" y="184" fill="#ffffff" font-size="43" font-weight="700">LIMITS RESET. CREDITS KEPT DRAINING.</text>
    <text x="64" y="221" fill="#cbd5e1" font-size="23">Two automatic Claude Individual-plan recharges on August 1 JST.</text>

    <g filter="url(#shadow)">
      <rect x="64" y="253" width="1072" height="170" rx="26" fill="#111827" stroke="#334155"/>
      <text x="96" y="298" fill="#94a3b8" font-size="18" font-weight="700">DISPUTED AUTOMATIC RECHARGES</text>
      <text x="96" y="382" fill="url(#money)" font-size="78" font-weight="700">USD 995.67</text>
      <g transform="translate(695 281)">
        <rect width="405" height="108" rx="18" fill="#0b1220" stroke="#374151"/>
        <text x="25" y="44" fill="#f8fafc" font-size="29" font-weight="700">496.75 + 498.92</text>
        <text x="25" y="78" fill="#cbd5e1" font-size="19">Two original merchant transaction pairs</text>
      </g>
    </g>

    <g transform="translate(64 456)">
      <rect width="1072" height="112" rx="20" fill="#0f172a" stroke="#334155"/>
      <line x1="358" y1="18" x2="358" y2="94" stroke="#334155"/>
      <line x1="716" y1="18" x2="716" y2="94" stroke="#334155"/>

      <text x="28" y="47" fill="#ffffff" font-size="25" font-weight="700">PAYMENTS PROVEN</text>
      <text x="28" y="80" fill="#cbd5e1" font-size="18">Original records delivered privately</text>

      <text x="388" y="47" fill="#ffffff" font-size="25" font-weight="700">MANUAL TOP-UPS</text>
      <text x="388" y="80" fill="#cbd5e1" font-size="18">Excluded from this incident</text>

      <text x="746" y="47" fill="#ffffff" font-size="25" font-weight="700">LEDGER JOIN MISSING</text>
      <text x="746" y="80" fill="#cbd5e1" font-size="18">Entitlement → debit → recharge</text>
    </g>

    <text x="64" y="617" fill="#f8fafc" font-size="21" font-weight="700">Customer-observed reset/routing state requires Anthropic's transaction-level reconciliation.</text>
    <text x="64" y="651" fill="#93c5fd" font-size="19" font-weight="650">github.com/anthropics/claude-code/issues/83062</text>
    <text x="1136" y="651" fill="#94a3b8" font-size="15" text-anchor="end">No invoice IDs, card data, or account identifiers</text>
  </g>
</svg>
